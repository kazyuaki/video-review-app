name: video-review-app

services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: video-review-php
    working_dir: /var/www
    volumes:
      - ./api:/var/www
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - video-review-network

  nginx:
    image: nginx:alpine
    container_name: video-review-nginx
    ports:
      - "8080:80"
    volumes:
      - ./api:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - video-review-network

  mysql:
    image: mysql:8.4
    container_name: video-review-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: video_review_app
      MYSQL_USER: video_review_user
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Tokyo
    volumes:
      - ./docker/mysql/data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - -h
        - localhost
        - -uroot
        - -proot
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - video-review-network

  node:
    build:
      context: .
      dockerfile: docker/node/Dockerfile
    container_name: video-review-node
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - ./node:/app
      - node_modules:/app/node_modules?
    tty: true
    stdin_open: true
    networks:
      - video-review-network

networks:
  video-review-network:
    driver: bridge

volumes:
  node_modules: